[tack]
recomposable = true

[shorturls]

[all_follow]
nixpkgs = "nixpkgs"
flake-parts = "flake-parts"

[inputs]
[inputs.nixpkgs]
url = "github:NixOS/nixpkgs/nixos-unstable"

[inputs.mnw]
url = "github:Gerg-L/mnw"

[inputs.flake-parts]
url = "github:hercules-ci/flake-parts"

[inputs.blink-cmp]
url = "github:saghen/blink.cmp"

[inputs.blink-pairs]
url = "github:saghen/blink.pairs"

[inputs.neonuget]
url = "github:MonsieurTib/neonuget"
type = "fetch"
group = "plugin"

[inputs.clip-paste-nvim]
url = "github:pugarte7/clip-paste.nvim"
type = "fetch"
group = "plugin"
